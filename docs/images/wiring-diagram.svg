<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Feather Bike Computer wiring diagram</title>
  <desc id="desc">The FeatherS3[D] with the 2.9 inch eInk FeatherWing stacked on its headers (SPI), a 2000 mAh LiPo on the JST PH connector, the ANO encoder adapter on the always-on I2C1 STEMMA QT port, and the BMP581 then the Mini GPS PA1010D chained on the I2C2 STEMMA QT port powered by LDO2. The ANO interrupt pin is wired to GPIO5.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 22px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .t { font-size: 12.5px; fill: #374151; }
    .s { font-size: 11.5px; fill: #4b5563; }
    .lbl { font-size: 11.5px; font-weight: 600; }
    .box { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
    .main { fill: #f3f4f6; stroke: #111827; stroke-width: 2; }
    .chip { fill: #ffffff; stroke: #9ca3af; stroke-width: 1; }
    .i2c1 { stroke: #2563eb; stroke-width: 5; fill: none; stroke-linecap: round; }
    .i2c2 { stroke: #d97706; stroke-width: 5; fill: none; stroke-linecap: round; }
    .spi { stroke: #7c3aed; stroke-width: 5; fill: none; }
    .pwr { stroke: #dc2626; stroke-width: 5; fill: none; stroke-linecap: round; }
    .int { stroke: #16a34a; stroke-width: 3; fill: none; stroke-dasharray: 8 6; stroke-linecap: round; }
  </style>

  <rect x="0" y="0" width="1000" height="640" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="40" y="48" class="title">Feather Bike Computer — wiring</text>

  <!-- Display FeatherWing (stacked on top of the Feather) -->
  <rect x="300" y="80" width="400" height="92" rx="10" class="box"/>
  <text x="500" y="106" class="h" text-anchor="middle">2.9" grayscale eInk FeatherWing</text>
  <text x="500" y="126" class="t" text-anchor="middle">Adafruit 4777 · SSD1680 · 296 × 128 · stacked on top</text>
  <text x="500" y="148" class="s" text-anchor="middle">SCK 36 · MOSI 35 · MISO 37 · EPD CS 1 · DC 3</text>
  <text x="500" y="164" class="s" text-anchor="middle">SRAM CS 38 · SD CS 33</text>

  <!-- Headers (SPI) -->
  <line x1="440" y1="172" x2="440" y2="214" class="spi"/>
  <line x1="560" y1="172" x2="560" y2="214" class="spi"/>
  <text x="500" y="198" class="lbl" text-anchor="middle" style="fill:#7c3aed">Feather headers</text>

  <!-- FeatherS3[D] -->
  <rect x="300" y="214" width="400" height="206" rx="12" class="main"/>
  <text x="500" y="242" class="h" text-anchor="middle">Unexpected Maker FeatherS3[D]</text>
  <text x="500" y="262" class="t" text-anchor="middle">Adafruit 6399 · ESP32-S3 · 16 MB flash · 8 MB PSRAM</text>
  <rect x="340" y="278" width="200" height="44" rx="6" class="chip"/>
  <text x="440" y="296" class="s" text-anchor="middle">MAX17048 fuel gauge</text>
  <text x="440" y="313" class="s" text-anchor="middle">on board · I2C1 · 0x36</text>
  <text x="690" y="300" class="lbl" text-anchor="end" style="fill:#2563eb">I2C1 STEMMA QT ▸</text>
  <text x="690" y="316" class="s" text-anchor="end">always on · SDA 8 / SCL 9</text>
  <text x="690" y="362" class="lbl" text-anchor="end" style="fill:#d97706">I2C2 vertical STEMMA QT ▸</text>
  <text x="690" y="378" class="s" text-anchor="end">LDO2 (GPIO39) · SDA 16 / SCL 15</text>
  <text x="312" y="362" class="lbl" style="fill:#dc2626">◂ JST PH battery</text>
  <text x="312" y="378" class="s">charger on board</text>
  <text x="600" y="410" class="lbl" text-anchor="middle" style="fill:#16a34a">GPIO5 (A5) ▾</text>

  <!-- Battery -->
  <rect x="40" y="320" width="190" height="84" rx="10" class="box"/>
  <text x="135" y="346" class="h" text-anchor="middle">LiPo battery</text>
  <text x="135" y="366" class="t" text-anchor="middle">2000 mAh · 3.7 V</text>
  <text x="135" y="386" class="s" text-anchor="middle">55 × 35 × 10 mm</text>
  <line x1="230" y1="362" x2="300" y2="362" class="pwr"/>

  <!-- ANO encoder adapter on I2C1 -->
  <rect x="780" y="190" width="190" height="96" rx="10" class="box"/>
  <text x="875" y="216" class="h" text-anchor="middle">ANO encoder</text>
  <text x="875" y="236" class="t" text-anchor="middle">on I2C adapter (seesaw)</text>
  <text x="875" y="254" class="s" text-anchor="middle">Adafruit 6310</text>
  <text x="875" y="274" class="lbl" text-anchor="middle" style="fill:#2563eb">I2C1 · 0x49</text>
  <text x="964" y="264" class="lbl" text-anchor="end" style="fill:#16a34a">INT ▸</text>
  <path d="M700 306 L740 306 L740 238 L780 238" class="i2c1"/>

  <!-- BMP581 on I2C2 -->
  <rect x="780" y="322" width="190" height="84" rx="10" class="box"/>
  <text x="875" y="348" class="h" text-anchor="middle">BMP581 barometer</text>
  <text x="875" y="368" class="s" text-anchor="middle">Adafruit 6407</text>
  <text x="875" y="390" class="lbl" text-anchor="middle" style="fill:#d97706">I2C2 · 0x47</text>
  <line x1="700" y1="368" x2="780" y2="368" class="i2c2"/>

  <!-- GPS chained from the BMP581 -->
  <rect x="780" y="458" width="190" height="84" rx="10" class="box"/>
  <text x="875" y="484" class="h" text-anchor="middle">Mini GPS PA1010D</text>
  <text x="875" y="504" class="s" text-anchor="middle">Adafruit 4415</text>
  <text x="875" y="526" class="lbl" text-anchor="middle" style="fill:#d97706">I2C2 · 0x10</text>
  <line x1="875" y1="406" x2="875" y2="458" class="i2c2"/>

  <!-- ANO interrupt wire (to solder) -->
  <path d="M970 260 L988 260 L988 442 L600 442 L600 420" class="int"/>
  <text x="790" y="436" class="s" text-anchor="middle" style="fill:#16a34a">INT pad → GPIO5 (active low)</text>

  <!-- Legend -->
  <text x="40" y="472" class="h">Legend</text>
  <line x1="40" y1="496" x2="84" y2="496" class="i2c1"/>
  <text x="96" y="500" class="t">I2C1, always powered — STEMMA QT, 50 mm cable</text>
  <line x1="40" y1="522" x2="84" y2="522" class="i2c2"/>
  <text x="96" y="526" class="t">I2C2 on LDO2, off in deep sleep — STEMMA QT, 50 mm cables</text>
  <line x1="40" y1="548" x2="84" y2="548" class="spi"/>
  <text x="96" y="552" class="t">SPI through the stacked Feather headers</text>
  <line x1="40" y1="574" x2="84" y2="574" class="pwr"/>
  <text x="96" y="578" class="t">Battery, JST PH connector</text>
  <line x1="40" y1="600" x2="84" y2="600" class="int"/>
  <text x="96" y="604" class="t">Wire to solder: ANO adapter INT pad → FeatherS3[D] GPIO5 (A5), proposed</text>
  <text x="960" y="620" class="s" text-anchor="end">Bus split confirmed by I2C scan; GPIO5 is proposed; see docs/wiring.md</text>
</svg>
