<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1720" width="1000" height="1720">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111; }
    .doc { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: 700; }
    .cap { font-size: 17px; font-weight: 700; }
    .sub { font-size: 13px; fill: #4b5563; }
    .note { font-size: 14px; fill: #374151; }
    .lbl { font-size: 7.5px; font-weight: 700; letter-spacing: 0.5px; }
    .b { font-weight: 700; }
    .panel { fill: #efeee8; }
    .bezel { fill: #2b2b2b; }
    .ink { stroke: #111; fill: none; }
    .rule { stroke: #111; stroke-width: 0.7; }
  </style>

  <defs>
    <!-- Status bar for a 128 x 296 portrait screen -->
    <g id="sb">
      <circle cx="5" cy="7" r="2.6" fill="#111"/>
      <text x="9" y="10" font-size="8" class="b">GPS</text>
      <circle cx="33" cy="7" r="2.6" fill="#111"/>
      <text x="37" y="10" font-size="8" class="b">REC</text>
      <text x="84" y="10.5" font-size="9.5" class="b" text-anchor="middle">09:42</text>
      <rect x="104" y="2.5" width="18" height="9" class="ink" stroke-width="1.1"/>
      <rect x="106" y="4.5" width="11" height="5" fill="#111"/>
      <rect x="122" y="5" width="2.2" height="4" fill="#111"/>
      <line x1="0" y1="14.5" x2="128" y2="14.5" stroke="#111" stroke-width="1"/>
    </g>
    <g id="d"><circle r="2.1" class="ink"/></g>
    <g id="D"><circle r="2.5" fill="#111"/></g>
  </defs>

  <rect width="1000" height="1720" fill="#ffffff"/>
  <text x="40" y="48" class="doc title">Feather Bike Computer — screen drafts (portrait)</text>
  <text x="40" y="74" class="doc sub">2.9" e-paper, 128 × 296 px, monochrome, portrait. Shown at 2× scale. Values are examples.</text>

  <!-- ================= 1. Ride ================= -->
  <text x="40" y="118" class="doc cap">1 · Ride — main screen</text>
  <text x="40" y="138" class="doc sub">Speed first; every value in a fixed box.</text>
  <rect x="32" y="150" width="272" height="608" rx="10" class="bezel"/>
  <g transform="translate(40 158) scale(2)">
    <rect width="128" height="296" class="panel"/>
    <use href="#sb"/>
    <text x="6" y="28" class="lbl">SPEED</text>
    <text x="6" y="70" font-size="46" class="b">27.4</text>
    <text x="6" y="84" font-size="10" class="b">km/h</text>
    <line x1="0" y1="94.5" x2="128" y2="94.5" class="rule"/>
    <text x="6" y="108" class="lbl">DISTANCE</text>
    <text x="6" y="131" font-size="22" class="b">18.62<tspan font-size="10"> km</tspan></text>
    <line x1="0" y1="142.5" x2="128" y2="142.5" class="rule"/>
    <text x="6" y="156" class="lbl">RIDE TIME</text>
    <text x="6" y="179" font-size="22" class="b">0:41:07</text>
    <line x1="0" y1="190.5" x2="128" y2="190.5" class="rule"/>
    <text x="6" y="204" class="lbl">AVG</text>
    <text x="6" y="223" font-size="16" class="b">24.8</text>
    <text x="68" y="204" class="lbl">MAX</text>
    <text x="68" y="223" font-size="16" class="b">52.1</text>
    <line x1="64" y1="196" x2="64" y2="230" class="rule"/>
    <line x1="0" y1="236.5" x2="128" y2="236.5" class="rule"/>
    <text x="6" y="250" class="lbl">ASCENT</text>
    <text x="6" y="269" font-size="16" class="b">286<tspan font-size="9"> m</tspan></text>
    <text x="68" y="250" class="lbl">ALTITUDE</text>
    <text x="68" y="269" font-size="16" class="b">412<tspan font-size="9"> m</tspan></text>
    <line x1="64" y1="242" x2="64" y2="276" class="rule"/>
    <use href="#D" x="48" y="288"/><use href="#d" x="56" y="288"/><use href="#d" x="64" y="288"/><use href="#d" x="72" y="288"/><use href="#d" x="80" y="288"/>
  </g>

  <!-- ================= 2. Navigation ================= -->
  <text x="360" y="118" class="doc cap">2 · Navigation — follow a GPX route</text>
  <text x="360" y="138" class="doc sub">Track-up map, your position, distance left.</text>
  <rect x="352" y="150" width="272" height="608" rx="10" class="bezel"/>
  <g transform="translate(360 158) scale(2)">
    <rect width="128" height="296" class="panel"/>
    <use href="#sb"/>
    <!-- map -->
    <path d="M64 206 L62 186 L58 166 L60 150" class="ink" stroke-width="1.2" stroke-dasharray="2 2"/>
    <path d="M60 150 L66 128 L80 112 L92 94 L88 74 L70 58 L52 46 L46 26" class="ink" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 140 L67 156 L60 152 L53 156 Z" fill="#111" stroke="#efeee8" stroke-width="1"/>
    <circle cx="116" cy="26" r="7" class="ink" stroke-width="1"/>
    <path d="M116 20 L119 28 L116 26 L113 28 Z" fill="#111"/>
    <line x1="6" y1="196" x2="30" y2="196" stroke="#111" stroke-width="1.5"/>
    <line x1="6" y1="193" x2="6" y2="199" stroke="#111" stroke-width="1.2"/>
    <line x1="30" y1="193" x2="30" y2="199" stroke="#111" stroke-width="1.2"/>
    <text x="34" y="199" font-size="8">250 m</text>
    <line x1="0" y1="210.5" x2="128" y2="210.5" stroke="#111" stroke-width="1"/>
    <!-- data -->
    <text x="6" y="224" class="lbl">TO FINISH</text>
    <text x="6" y="243" font-size="16" class="b">23.4<tspan font-size="9"> km</tspan></text>
    <text x="68" y="224" class="lbl">SPEED</text>
    <text x="68" y="243" font-size="16" class="b">27.4</text>
    <line x1="64" y1="216" x2="64" y2="250" class="rule"/>
    <line x1="0" y1="254.5" x2="128" y2="254.5" class="rule"/>
    <text x="64" y="273" font-size="10.5" class="b" text-anchor="middle">✓ ON ROUTE</text>
    <use href="#d" x="48" y="288"/><use href="#D" x="56" y="288"/><use href="#d" x="64" y="288"/><use href="#d" x="72" y="288"/><use href="#d" x="80" y="288"/>
  </g>

  <!-- ================= 3. Climb ================= -->
  <text x="680" y="118" class="doc cap">3 · Climb</text>
  <text x="680" y="138" class="doc sub">Altitude, ascent, grade, and the route ahead.</text>
  <rect x="672" y="150" width="272" height="608" rx="10" class="bezel"/>
  <g transform="translate(680 158) scale(2)">
    <rect width="128" height="296" class="panel"/>
    <use href="#sb"/>
    <text x="6" y="28" class="lbl">ALTITUDE</text>
    <text x="6" y="62" font-size="34" class="b">412<tspan font-size="13"> m</tspan></text>
    <line x1="0" y1="72.5" x2="128" y2="72.5" class="rule"/>
    <text x="6" y="86" class="lbl">ASCENT</text>
    <text x="6" y="108" font-size="20" class="b">286<tspan font-size="10"> m</tspan></text>
    <line x1="0" y1="118.5" x2="128" y2="118.5" class="rule"/>
    <text x="6" y="132" class="lbl">GRADE</text>
    <text x="6" y="154" font-size="20" class="b">6.2<tspan font-size="10"> %</tspan></text>
    <line x1="0" y1="164.5" x2="128" y2="164.5" class="rule"/>
    <text x="6" y="178" class="lbl">ROUTE AHEAD · 5 KM</text>
    <path d="M6 262 L18 258 L30 252 L42 244 L54 236 L66 230 L78 222 L90 226 L102 216 L114 206 L122 204" class="ink" stroke-width="1.6"/>
    <line x1="30" y1="190" x2="30" y2="270" stroke="#111" stroke-width="0.8" stroke-dasharray="2 2"/>
    <circle cx="30" cy="252" r="3" fill="#111"/>
    <line x1="6" y1="270.5" x2="122" y2="270.5" stroke="#111" stroke-width="0.8"/>
    <text x="122" y="200" font-size="8" text-anchor="end">+184 m</text>
    <use href="#d" x="48" y="288"/><use href="#d" x="56" y="288"/><use href="#D" x="64" y="288"/><use href="#d" x="72" y="288"/><use href="#d" x="80" y="288"/>
  </g>

  <!-- ================= 4. Summary ================= -->
  <text x="40" y="818" class="doc cap">4 · Ride summary</text>
  <text x="40" y="838" class="doc sub">Averages and totals; shown when a ride ends.</text>
  <rect x="32" y="850" width="272" height="608" rx="10" class="bezel"/>
  <g transform="translate(40 858) scale(2)">
    <rect width="128" height="296" class="panel"/>
    <use href="#sb"/>
    <text x="6" y="30" class="lbl">AVG SPEED</text>
    <text x="6" y="49" font-size="16" class="b">24.8<tspan font-size="9"> km/h</tspan></text>
    <line x1="0" y1="57.5" x2="128" y2="57.5" class="rule"/>
    <text x="6" y="71" class="lbl">MAX SPEED</text>
    <text x="6" y="90" font-size="16" class="b">52.1<tspan font-size="9"> km/h</tspan></text>
    <line x1="0" y1="98.5" x2="128" y2="98.5" class="rule"/>
    <text x="6" y="112" class="lbl">DISTANCE</text>
    <text x="6" y="131" font-size="16" class="b">18.62<tspan font-size="9"> km</tspan></text>
    <line x1="0" y1="139.5" x2="128" y2="139.5" class="rule"/>
    <text x="6" y="153" class="lbl">MOVING TIME</text>
    <text x="6" y="172" font-size="16" class="b">0:38:55</text>
    <line x1="0" y1="180.5" x2="128" y2="180.5" class="rule"/>
    <text x="6" y="194" class="lbl">ASCENT</text>
    <text x="6" y="213" font-size="16" class="b">286<tspan font-size="9"> m</tspan></text>
    <line x1="0" y1="221.5" x2="128" y2="221.5" class="rule"/>
    <text x="6" y="235" class="lbl">DESCENT</text>
    <text x="6" y="254" font-size="16" class="b">241<tspan font-size="9"> m</tspan></text>
    <use href="#d" x="48" y="288"/><use href="#d" x="56" y="288"/><use href="#d" x="64" y="288"/><use href="#D" x="72" y="288"/><use href="#d" x="80" y="288"/>
  </g>

  <!-- ================= 5. Status ================= -->
  <text x="360" y="818" class="doc cap">5 · Device status</text>
  <text x="360" y="838" class="doc sub">Sensors, battery, storage, loaded route.</text>
  <rect x="352" y="850" width="272" height="608" rx="10" class="bezel"/>
  <g transform="translate(360 858) scale(2)">
    <rect width="128" height="296" class="panel"/>
    <use href="#sb"/>
    <text x="6" y="31" font-size="9.5" class="b">GPS</text>
    <text x="6" y="44" font-size="9.5">3D fix · 9 sats · ±4 m</text>
    <text x="6" y="66" font-size="9.5" class="b">Baro</text>
    <text x="6" y="79" font-size="9.5">1013.2 hPa · 21.4 °C</text>
    <text x="6" y="101" font-size="9.5" class="b">Battery</text>
    <text x="6" y="114" font-size="9.5">78 % · 3.92 V</text>
    <text x="6" y="136" font-size="9.5" class="b">Storage</text>
    <text x="6" y="149" font-size="9.5">microSD · 3.1 GB free</text>
    <text x="6" y="171" font-size="9.5" class="b">Route</text>
    <text x="6" y="184" font-size="9.5">col-de-la-croix.gpx</text>
    <text x="6" y="206" font-size="9.5" class="b">Firmware</text>
    <text x="6" y="219" font-size="9.5">0.1.0 · CircuitPython</text>
    <use href="#d" x="48" y="288"/><use href="#d" x="56" y="288"/><use href="#d" x="64" y="288"/><use href="#d" x="72" y="288"/><use href="#D" x="80" y="288"/>
  </g>

  <!-- ================= 6. Menu ================= -->
  <text x="680" y="818" class="doc cap">6 · Menu</text>
  <text x="680" y="838" class="doc sub">Center button from any screen.</text>
  <rect x="672" y="850" width="272" height="608" rx="10" class="bezel"/>
  <g transform="translate(680 858) scale(2)">
    <rect width="128" height="296" class="panel"/>
    <use href="#sb"/>
    <rect x="3" y="22" width="122" height="20" fill="#111"/>
    <text x="9" y="36" font-size="11" class="b" style="fill:#efeee8">▶ Start ride</text>
    <text x="9" y="61" font-size="11">Pause ride</text>
    <text x="9" y="84" font-size="11">End and save</text>
    <text x="9" y="107" font-size="11">Load route…</text>
    <text x="9" y="130" font-size="11">Settings</text>
    <text x="9" y="153" font-size="11">Sleep</text>
    <line x1="0" y1="262.5" x2="128" y2="262.5" class="rule"/>
    <text x="64" y="276" font-size="8" text-anchor="middle">▲▼ move   ● select   ◀ back</text>
  </g>

  <!-- ================= Notes ================= -->
  <text x="40" y="1510" class="doc cap">Controls (ANO encoder)</text>
  <text x="40" y="1538" class="doc note">• Wheel or ◀ ▶ — previous / next screen: Ride → Navigation → Climb → Summary → Status</text>
  <text x="40" y="1560" class="doc note">• Center — open the menu; select an item   • ▲ ▼ — move in the menu</text>
  <text x="40" y="1600" class="doc cap">Refresh plan (to confirm with the display experiment, #2)</text>
  <text x="40" y="1628" class="doc note">• Every second: partial refresh of the boxes whose value changed (speed, time, distance…)</text>
  <text x="40" y="1650" class="doc note">• Map: redraw every few seconds or after moving a set distance, to limit refresh time</text>
  <text x="40" y="1672" class="doc note">• Full refresh on screen change and every few minutes, to clear e-paper ghosting</text>
  <text x="40" y="1694" class="doc note">• Black on white only; Navigation shows the ridden part dashed and the route ahead in bold</text>
</svg>
